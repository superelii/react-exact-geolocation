<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-geolocation 演示</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #1e293b;
        --accent: #38bdf8;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --ok: #4ade80;
        --err: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 32px 16px;
      }
      .wrap { width: 100%; max-width: 640px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
      .card {
        background: var(--card);
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 16px;
      }
      label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      input, select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0f172a;
        color: var(--text);
        font-size: 14px;
        margin-bottom: 14px;
      }
      .row { display: flex; gap: 12px; }
      .row > * { flex: 1; }
      .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); margin-bottom: 14px; }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #04293a;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #334155; font-size: 14px; }
      .kv:last-child { border-bottom: none; }
      .kv .k { color: var(--muted); }
      .kv .v { font-variant-numeric: tabular-nums; text-align: right; }
      .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
      .status-ok { color: var(--ok); }
      .status-err { color: var(--err); }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #334155; color: var(--accent); }
      button.ghost {
        width: auto;
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
        padding: 12px 16px;
      }
      .badge.perm-granted { background: rgba(74,222,128,0.15); color: var(--ok); }
      .badge.perm-denied { background: rgba(248,113,113,0.15); color: var(--err); }
      .badge.perm-prompt { background: rgba(56,189,248,0.15); color: var(--accent); }
      .badge.perm-unsupported { background: rgba(148,163,184,0.15); color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
